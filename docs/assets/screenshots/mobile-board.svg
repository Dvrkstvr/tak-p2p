<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="#030712" rx="16" />

  <!-- Left: Mobile Device Mockup (iPhone / Android) -->
  <g transform="translate(100, 20)" filter="url(#phoneShadow)">
    <!-- Phone Outer Bezel -->
    <rect width="250" height="440" rx="36" fill="#1f2937" stroke="#374151" stroke-width="3" />
    <!-- Screen Area -->
    <rect x="10" y="10" width="230" height="420" rx="28" fill="url(#phoneBgGrad)" />

    <!-- Dynamic Island / Speaker notch -->
    <rect x="85" y="18" width="80" height="18" rx="9" fill="#000000" />
    <circle cx="150" cy="27" r="4" fill="#1e293b" />

    <!-- Mobile App Status Bar -->
    <text x="25" y="31" fill="#f9fafb" font-family="sans-serif" font-size="9" font-weight="bold">9:41</text>
    <text x="195" y="31" fill="#f9fafb" font-family="sans-serif" font-size="9">5G 100%</text>

    <!-- App Header -->
    <rect x="20" y="48" width="210" height="34" rx="8" fill="#1f2937" />
    <text x="32" y="69" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">⚡ Tak Mobile PWA</text>
    <rect x="175" y="55" width="45" height="20" rx="4" fill="#3b82f6" />
    <text x="183" y="69" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">INVITE</text>

    <!-- Player Scores -->
    <rect x="20" y="90" width="100" height="34" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="28" y="105" fill="#f3f4f6" font-family="sans-serif" font-size="10" font-weight="bold">You (White)</text>
    <text x="28" y="118" fill="#38bdf8" font-family="sans-serif" font-size="9">18 Flats • 1 Cap</text>

    <rect x="130" y="90" width="100" height="34" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
    <text x="138" y="105" fill="#9ca3af" font-family="sans-serif" font-size="10" font-weight="bold">Opponent</text>
    <text x="138" y="118" fill="#9ca3af" font-family="sans-serif" font-size="9">17 Flats • 1 Cap</text>

    <!-- 5x5 Mini Mobile Board -->
    <g transform="translate(20, 134)">
      <rect width="210" height="210" rx="10" fill="#78350f" stroke="#92400e" stroke-width="2" />
      <!-- 5x5 Grid squares -->
      <rect x="8" y="8" width="34" height="34" rx="3" fill="#fef3c7" />
      <rect x="48" y="8" width="34" height="34" rx="3" fill="#d97706" />
      <rect x="88" y="8" width="34" height="34" rx="3" fill="#fef3c7" />
      <rect x="128" y="8" width="34" height="34" rx="3" fill="#d97706" />
      <rect x="168" y="8" width="34" height="34" rx="3" fill="#fef3c7" />

      <rect x="8" y="48" width="34" height="34" rx="3" fill="#d97706" />
      <rect x="48" y="48" width="34" height="34" rx="3" fill="#fef3c7" />
      <rect x="88" y="48" width="34" height="34" rx="3" fill="#d97706" />
      <rect x="128" y="48" width="34" height="34" rx="3" fill="#fef3c7" />
      <rect x="168" y="48" width="34" height="34" rx="3" fill="#d97706" />

      <rect x="8" y="88" width="34" height="34" rx="3" fill="#fef3c7" />
      <rect x="48" y="88" width="34" height="34" rx="3" fill="#d97706" />
      <rect x="88" y="88" width="34" height="34" rx="3" fill="#fef3c7" stroke="#38bdf8" stroke-width="2" />
      <rect x="128" y="88" width="34" height="34" rx="3" fill="#d97706" />
      <rect x="168" y="88" width="34" height="34" rx="3" fill="#fef3c7" />

      <rect x="8" y="128" width="34" height="34" rx="3" fill="#d97706" />
      <rect x="48" y="128" width="34" height="34" rx="3" fill="#fef3c7" />
      <rect x="88" y="128" width="34" height="34" rx="3" fill="#d97706" />
      <rect x="128" y="128" width="34" height="34" rx="3" fill="#fef3c7" />
      <rect x="168" y="128" width="34" height="34" rx="3" fill="#d97706" />

      <rect x="8" y="168" width="34" height="34" rx="3" fill="#fef3c7" />
      <rect x="48" y="168" width="34" height="34" rx="3" fill="#d97706" />
      <rect x="88" y="168" width="34" height="34" rx="3" fill="#fef3c7" />
      <rect x="128" y="168" width="34" height="34" rx="3" fill="#d97706" />
      <rect x="168" y="168" width="34" height="34" rx="3" fill="#fef3c7" />

      <!-- Pieces -->
      <rect x="13" y="13" width="24" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="53" y="53" width="24" height="24" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />
      <circle cx="105" cy="105" r="11" fill="#38bdf8" />
      <text x="102" y="109" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold">2</text>
    </g>

    <!-- Touch Slide & Place Controls -->
    <rect x="20" y="354" width="210" height="36" rx="8" fill="#1f2937" />
    <rect x="25" y="358" width="60" height="28" rx="6" fill="#3b82f6" />
    <text x="37" y="376" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Flat</text>
    <rect x="92" y="358" width="60" height="28" rx="6" fill="#374151" />
    <text x="107" y="376" fill="#d1d5db" font-family="sans-serif" font-size="10">Wall</text>
    <rect x="160" y="358" width="65" height="28" rx="6" fill="#374151" />
    <text x="175" y="376" fill="#d1d5db" font-family="sans-serif" font-size="10">Cap</text>

    <!-- Home indicator bar -->
    <rect x="80" y="418" width="90" height="4" rx="2" fill="#9ca3af" />
  </g>

  <!-- Right: Feature Cards for Mobile Users -->
  <g transform="translate(400, 50)">
    <text x="0" y="30" fill="#f9fafb" font-family="sans-serif" font-size="22" font-weight="bold">Play on Any Mobile Device</text>
    <text x="0" y="55" fill="#94a3b8" font-family="sans-serif" font-size="13">Immediate touch gameplay without app store downloads</text>

    <!-- Card 1: iOS / iPhone -->
    <g transform="translate(0, 80)">
      <rect width="360" height="85" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
      <circle cx="35" cy="42" r="18" fill="#1e293b" />
      <text x="27" y="48" fill="#f9fafb" font-family="sans-serif" font-size="18"></text>
      <text x="65" y="34" fill="#f9fafb" font-family="sans-serif" font-size="14" font-weight="bold">iPhone &amp; iPad (Safari PWA)</text>
      <text x="65" y="52" fill="#9ca3af" font-family="sans-serif" font-size="11">Open in Safari → Tap Share → "Add to Home Screen"</text>
      <text x="65" y="68" fill="#10b981" font-family="sans-serif" font-size="11">✓ Full-screen native experience, zero install needed</text>
    </g>

    <!-- Card 2: Android -->
    <g transform="translate(0, 180)">
      <rect width="360" height="85" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
      <circle cx="35" cy="42" r="18" fill="#1e293b" />
      <text x="27" y="48" fill="#22c55e" font-family="sans-serif" font-size="18">🤖</text>
      <text x="65" y="34" fill="#f9fafb" font-family="sans-serif" font-size="14" font-weight="bold">Android (Chrome / Edge PWA)</text>
      <text x="65" y="52" fill="#9ca3af" font-family="sans-serif" font-size="11">Open in Chrome → "Install App" / Add to Home Screen</text>
      <text x="65" y="68" fill="#10b981" font-family="sans-serif" font-size="11">✓ Standalone window, responsive touch slide controls</text>
    </g>

    <!-- Card 3: QR Code Matchmaking -->
    <g transform="translate(0, 280)">
      <rect width="360" height="85" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
      <circle cx="35" cy="42" r="18" fill="#1e293b" />
      <text x="26" y="47" fill="#38bdf8" font-family="sans-serif" font-size="16">📷</text>
      <text x="65" y="34" fill="#f9fafb" font-family="sans-serif" font-size="14" font-weight="bold">Instant QR Matchmaking</text>
      <text x="65" y="52" fill="#9ca3af" font-family="sans-serif" font-size="11">Scan opponent's phone screen directly with camera</text>
      <text x="65" y="68" fill="#38bdf8" font-family="sans-serif" font-size="11">✓ Automatic peer handshake over encrypted Nostr pipe</text>
    </g>
  </g>
</svg>
