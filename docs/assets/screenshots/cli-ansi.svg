    <text x="0" y="98" fill="#a1a1aa">Transport: <tspan fill="#a855f7">Nostr kind:20001</tspan> | Peer: <tspan fill="#22d3ee">npub18f...4e9a</tspan> (Latency: <tspan fill="#4ade80">6 ms</tspan>)</text>

