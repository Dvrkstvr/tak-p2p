  <rect x="0" y="20" width="800" height="14" fill="#1f1f1f" />
  <circle cx="20" cy="17" r="5.5" fill="#e81123" />
  <circle cx="36" cy="17" r="5.5" fill="#f59e0b" />
  <circle cx="52" cy="17" r="5.5" fill="#107c41" />
  <text x="280" y="22" fill="#cccccc" font-family="'Consolas', 'Cascadia Code', monospace" font-size="12">TakApp.Cli — Spectre.Console ANSI Terminal Board</text>

