      <text x="0" y="102" fill="#facc15">3 </text><text x="20" y="102" fill="#64748b">│ </text><text x="35" y="102" fill="#a1a1aa">[B]  </text><text x="70" y="102" fill="#64748b">│ </text><text x="90" y="102" fill="#475569"> .   </text><text x="125" y="102" fill="#64748b">│ </text><text x="140" y="102" fill="#facc15" font-weight="bold">&lt;CW&gt; </text><text x="180" y="102" fill="#64748b">│ </text><text x="195" y="102" fill="#475569"> .   </text><text x="235" y="102" fill="#64748b">│ </text><text x="250" y="102" fill="#a1a1aa">[B]  </text><text x="290" y="102" fill="#64748b">│ </text><text x="305" y="102" fill="#facc15">3</text>
      <text x="0" y="118" fill="#64748b">  ├──────┼──────┼──────┼──────┼──────┤</text>
      <text x="0" y="136" fill="#facc15">2 </text><text x="20" y="136" fill="#64748b">│ </text><text x="35" y="136" fill="#475569"> .   </text><text x="70" y="136" fill="#64748b">│ </text><text x="90" y="136" fill="#ffffff">[W2] </text><text x="125" y="136" fill="#64748b">│ </text><text x="140" y="136" fill="#475569"> .   </text><text x="180" y="136" fill="#64748b">│ </text><text x="195" y="136" fill="#e2e8f0">[W]  </text><text x="235" y="136" fill="#64748b">│ </text><text x="250" y="136" fill="#475569"> .   </text><text x="290" y="136" fill="#64748b">│ </text><text x="305" y="136" fill="#facc15">2</text>
      <text x="0" y="152" fill="#64748b">  ├──────┼──────┼──────┼──────┼──────┤</text>
      <text x="0" y="170" fill="#facc15">1 </text><text x="20" y="170" fill="#64748b">│ </text><text x="35" y="170" fill="#ffffff">[W]  </text><text x="70" y="170" fill="#64748b">│ </text><text x="90" y="170" fill="#475569"> .   </text><text x="125" y="170" fill="#64748b">│ </text><text x="140" y="170" fill="#a1a1aa">[B]  </text><text x="180" y="170" fill="#64748b">│ </text><text x="195" y="170" fill="#475569"> .   </text><text x="235" y="170" fill="#64748b">│ </text><text x="250" y="170" fill="#ffffff">[W]  </text><text x="290" y="170" fill="#64748b">│ </text><text x="305" y="170" fill="#facc15">1</text>
