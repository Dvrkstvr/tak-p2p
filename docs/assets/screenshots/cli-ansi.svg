      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="800" height="480" fill="#0c0c0c" rx="12" stroke="#27272a" stroke-width="1.5" />

  <!-- Terminal Titlebar -->
