    <!-- Stack Inspector Side Panel -->
    <g transform="translate(420, 130)">
      <text x="0" y="0" fill="#38bdf8" font-weight="bold">STACK INSPECTOR: Square d4 [Height: 3]</text>
      <text x="0" y="18" fill="#64748b">────────────────────────────────────────</text>
      <text x="0" y="40" fill="#a1a1aa">Layer 3 (Top)   : <tspan fill="#f87171" font-weight="bold">BLACK FLAT</tspan> (Controlling)</text>
