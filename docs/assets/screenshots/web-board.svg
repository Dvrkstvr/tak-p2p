<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="sqGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="sqGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" rx="16" />

  <!-- Window chrome / browser bar -->
  <rect x="0" y="0" width="800" height="42" fill="#1e293b" rx="16" />
  <rect x="0" y="24" width="800" height="18" fill="#1e293b" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />
  <rect x="100" y="10" width="460" height="22" rx="6" fill="#0f172a" />
  <text x="115" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">🔒 https://dvrkstvr.github.io/tak-p2p/play — Zero-Install Web Client</text>
  <rect x="680" y="10" width="95" height="22" rx="6" fill="#38bdf8" />
  <text x="702" y="25" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="11">● LIVE P2P</text>

  <!-- Left Panel: Game Controls & Status -->
  <rect x="30" y="65" width="230" height="385" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="45" y="95" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="16">Tak P2P Web</text>
  <text x="45" y="115" fill="#94a3b8" font-family="sans-serif" font-size="12">Turn 14 — White to Move</text>

  <!-- Player 1 Status Card -->
  <rect x="45" y="135" width="200" height="60" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="65" cy="165" r="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  <text x="90" y="158" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12">Player 1 (White)</text>
  <text x="90" y="176" fill="#38bdf8" font-family="sans-serif" font-size="11">15 Flats • 1 Cap • 13:42</text>

  <!-- Player 2 Status Card -->
  <rect x="45" y="205" width="200" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <circle cx="65" cy="235" r="14" fill="#334155" stroke="#64748b" stroke-width="2" />
  <text x="90" y="228" fill="#cbd5e1" font-family="sans-serif" font-weight="bold" font-size="12">Opponent (Black)</text>
  <text x="90" y="246" fill="#94a3b8" font-family="sans-serif" font-size="11">14 Flats • 1 Cap • 14:10</text>

  <!-- Nostr Transport Info -->
  <rect x="45" y="280" width="200" height="90" rx="8" fill="#0f172a" />
  <text x="55" y="302" fill="#a855f7" font-family="sans-serif" font-weight="bold" font-size="11">⚡ Nostr Transport</text>
  <text x="55" y="322" fill="#94a3b8" font-family="sans-serif" font-size="10">Relay: wss://relay.damus.io</text>
  <text x="55" y="338" fill="#94a3b8" font-family="sans-serif" font-size="10">State Hash: 8f2a...c014 (Valid)</text>
  <text x="55" y="354" fill="#10b981" font-family="sans-serif" font-size="10">✓ NIP-44 End-to-End Encrypted</text>

  <rect x="45" y="385" width="200" height="42" rx="8" fill="#3b82f6" />
  <text x="95" y="411" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="13">Copy Invite Link</text>

  <!-- Center: 5x5 Tak Board in SVG -->
  <g transform="translate(285, 65)" filter="url(#shadow)">
    <!-- Board Border -->
    <rect width="385" height="385" rx="14" fill="url(#boardGrad)" stroke="#92400e" stroke-width="3" />

    <!-- 5x5 Grid Squares -->
    <!-- Row 0 (Top) -->
    <rect x="15" y="15" width="65" height="65" rx="6" fill="url(#sqGradLight)" />
    <rect x="87" y="15" width="65" height="65" rx="6" fill="url(#sqGradDark)" />
    <rect x="159" y="15" width="65" height="65" rx="6" fill="url(#sqGradLight)" />
    <rect x="231" y="15" width="65" height="65" rx="6" fill="url(#sqGradDark)" />
    <rect x="303" y="15" width="65" height="65" rx="6" fill="url(#sqGradLight)" />

    <!-- Row 1 -->
    <rect x="15" y="87" width="65" height="65" rx="6" fill="url(#sqGradDark)" />
    <rect x="87" y="87" width="65" height="65" rx="6" fill="url(#sqGradLight)" />
    <rect x="159" y="87" width="65" height="65" rx="6" fill="url(#sqGradDark)" />
    <rect x="231" y="87" width="65" height="65" rx="6" fill="url(#sqGradLight)" />
    <rect x="303" y="87" width="65" height="65" rx="6" fill="url(#sqGradDark)" />

    <!-- Row 2 -->
    <rect x="15" y="159" width="65" height="65" rx="6" fill="url(#sqGradLight)" />
    <rect x="87" y="159" width="65" height="65" rx="6" fill="url(#sqGradDark)" />
    <rect x="159" y="159" width="65" height="65" rx="6" fill="url(#sqGradLight)" stroke="#38bdf8" stroke-width="3" />
    <rect x="231" y="159" width="65" height="65" rx="6" fill="url(#sqGradDark)" />
    <rect x="303" y="159" width="65" height="65" rx="6" fill="url(#sqGradLight)" />

    <!-- Row 3 -->
    <rect x="15" y="231" width="65" height="65" rx="6" fill="url(#sqGradDark)" />
    <rect x="87" y="231" width="65" height="65" rx="6" fill="url(#sqGradLight)" />
    <rect x="159" y="231" width="65" height="65" rx="6" fill="url(#sqGradDark)" />
    <rect x="231" y="231" width="65" height="65" rx="6" fill="url(#sqGradLight)" />
    <rect x="303" y="231" width="65" height="65" rx="6" fill="url(#sqGradDark)" />

    <!-- Row 4 (Bottom) -->
    <rect x="15" y="303" width="65" height="65" rx="6" fill="url(#sqGradLight)" />
    <rect x="87" y="303" width="65" height="65" rx="6" fill="url(#sqGradDark)" />
    <rect x="159" y="303" width="65" height="65" rx="6" fill="url(#sqGradLight)" />
    <rect x="231" y="303" width="65" height="65" rx="6" fill="url(#sqGradDark)" />
    <rect x="303" y="303" width="65" height="65" rx="6" fill="url(#sqGradLight)" />

    <!-- Stones / Pieces -->
    <!-- White flat on (0,0) -->
    <rect x="25" y="27" width="45" height="41" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <!-- Black flat on (1,1) -->
    <rect x="97" y="99" width="45" height="41" rx="6" fill="#334155" stroke="#1e293b" stroke-width="2" />
    <!-- White stack with 3 pieces on (2,2) -->
    <rect x="169" y="181" width="45" height="30" rx="5" fill="#475569" stroke="#1e293b" stroke-width="1" />
    <rect x="169" y="174" width="45" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="169" y="167" width="45" height="30" rx="5" fill="#f8fafc" stroke="#38bdf8" stroke-width="2" />
    <circle cx="206" cy="174" r="8" fill="#38bdf8" />
    <text x="203" y="178" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="10">3</text>

    <!-- Black Wall on (3,2) -->
    <rect x="251" y="166" width="25" height="51" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="2" />

    <!-- White Capstone on (1,3) -->
    <polygon points="119,238 107,268 131,268" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
    <circle cx="119" cy="246" r="5" fill="#38bdf8" />

    <!-- Road connection highlight -->
    <path d="M 47,47 Q 119,119 191,189" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6,4" fill="none" opacity="0.8" />
  </g>

  <!-- Right Panel: PTN Move Scrubber -->
  <rect x="685" y="65" width="90" height="385" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="695" y="90" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12">PTN Log</text>
  <text x="695" y="115" fill="#94a3b8" font-family="monospace" font-size="10">1. a1 e5</text>
  <text x="695" y="135" fill="#94a3b8" font-family="monospace" font-size="10">2. c3 d3</text>
  <text x="695" y="155" fill="#94a3b8" font-family="monospace" font-size="10">3. b3 Sb4</text>
  <text x="695" y="175" fill="#94a3b8" font-family="monospace" font-size="10">4. 3c3+12</text>
  <text x="695" y="195" fill="#94a3b8" font-family="monospace" font-size="10">5. Cc4 b2</text>
  <text x="695" y="215" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="10">6. d4*</text>
</svg>
